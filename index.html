const TICK_ACTS=new Set(['hmode','cmetric','cper','chopen','tab','back','exg','resume','newtpl','edittpl','sheetclose','opensd','exinfo','rest','nxkind','tup','tdown','rminus','rplus','rskip','itemup','itemdown','itemhist','tghome','export']);
document.addEventListener('click',async e=>{
  if(S.active&&S.settings.awake&&!WL) wakeOn();
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(TICK_ACTS.has(act)) sfx('tick');
  const row=b.closest('.set');
  switch(act){
    case 'tab': switchTab(b.dataset.tab); break;
    case 'back':
      if(view.name==='tpl'&&tplDirty()&&!(await ask('Выйти без сохранения изменений?','Выйти',true))) return;
      back(); break;
    case 'resume': openSub({name:'session'}); break;
    case 'newtpl': openSub({name:'tpl',draft:{isNew:true,id:uid(),name:'',ex:[]},orig:JSON.stringify({n:'',e:[]})}); setTimeout(()=>{ const i=$('#tplname'); if(i) i.focus(); },60); break;
    case 'edittpl': { const t=S.templates.find(x=>x.id===id); if(!t) return; openSub({name:'tpl',draft:{isNew:false,id:t.id,name:t.name,ex:t.ex.slice()},orig:JSON.stringify({n:t.name,e:t.ex})}); break; }
    case 'start': startSession(id); break;
    case 'check': if(row) checkSet(+row.dataset.ii,+row.dataset.si); break;
    case 'addset': addSet(+b.dataset.ii); break;
    case 'delset': delSet(+b.dataset.ii); break;
    case 'itemmenu': itemMenu(+b.dataset.ii); break;
    case 'itemup': case 'itemdown': { const i=+b.dataset.ii, j=act==='itemup'?i-1:i+1, A=S.active.items; if(j<0||j>=A.length) return; const t=A[i]; A[i]=A[j]; A[j]=t; save(); closeSheet(); break; }
    case 'itemrm': { const i=+b.dataset.ii, it=S.active.items[i]; if(it.sets.some(s=>s.done)&&!(await ask('В этом упражнении уже есть отмеченные подходы. Убрать?','Убрать',true))) return; S.active.items.splice(i,1); save(); sfx('remove'); closeSheet(); break; }
    case 'itemhist': closeSheet(()=>openSub({name:'exd',id:id})); break;
    case 'addex': openPicker(S.active.items.map(i=>i.exId),(xid,on)=>{
        const A=S.active.items;
        if(on){ A.push(makeItem(xid)); }
        else { const k=A.findIndex(i=>i.exId===xid); if(k>=0){ if(A[k].sets.some(s=>s.done)){ toast('Там уже есть отмеченные подходы — убери через «⋯»'); pick.sel.add(xid); return; } A.splice(k,1); } }
        save();
      },'Добавить в тренировку'); break;
    case 'finish': finishSession(); break;
    case 'cancel': if(await ask('Бросить тренировку? Отмеченные подходы не сохранятся.','Бросить',true)){ S.active=null; save(); stopRest(); wakeOff(); sfx('remove'); back(); } break;
    case 'exinfo': if(view.name==='exd'&&view.id===id) return; openSub({name:'exd',id:id}); break;
    case 'togglemy': { const k=S.my.indexOf(id); if(k>=0) S.my.splice(k,1); else S.my.push(id); save();
        if(view.name==='ex'){ $('#exlist').innerHTML=exListHTML(); const c=document.querySelector('.chip[data-g="Мои"]'); if(c) c.textContent='Мои · '+S.my.length; } else render();
        sfx(k>=0?'remove':'add'); toast(k>=0?'Убрал из твоих':'Добавил в твои'); break; }
    case 'exg': exG=b.dataset.g; exQ=''; render(); break;
    case 'newex': newExSheet(b.dataset.name||'',null); break;
    case 'nxkind': b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); break;
    case 'nxsave': {
      const name=$('#nxname').value, group=$('#nxgroup').value, kind=(document.querySelector('#nxkind .on')||{}).dataset.k||'wr';
      if(!name.trim()){ sfx('error'); toast('Впиши название'); $('#nxname').focus(); return; }
      const before=S.custom.length; const xid=createCustom(name,group,kind); addMy(xid); save(); sfx('add');
      toast(S.custom.length>before?'Создал и добавил в твои':'Такое уже есть — добавил в твои');
      const then=newExThen; newExThen=null; exQ=''; exG='Мои';
      closeSheet(()=>{ if(then) then(xid); render(); }); break; }
    case 'pick': { if(!pick) return; const on=!pick.sel.has(id); if(on){ pick.sel.add(id); addMy(id); } else pick.sel.delete(id); pick.onToggle(id,on); save(); sfx(pick.sel.has(id)?'add':'remove'); $('#plist').innerHTML=pickListHTML(); break; }
    case 'pickcreate': { if(!pick) return; const xid=createCustom(pick.q,'Своё','wr'); if(!xid) return; addMy(xid); if(!pick.sel.has(xid)){ pick.sel.add(xid); pick.onToggle(xid,true); } save(); sfx('add'); toast('Создал «'+exById(xid).name+'»'); $('#plist').innerHTML=pickListHTML(); break; }
    case 'sheetclose': closeSheet(); break;
    case 'tadd': { const d=view.draft; openPicker(d.ex,(xid,on)=>{ if(on){ if(!d.ex.includes(xid)) d.ex.push(xid); } else d.ex=d.ex.filter(x=>x!==xid); },'Добавить упражнения'); break; }
    case 'tup': case 'tdown': { const d=view.draft, i=+b.dataset.i, j=act==='tup'?i-1:i+1; if(j<0||j>=d.ex.length) return; const t=d.ex[i]; d.ex[i]=d.ex[j]; d.ex[j]=t; render(); break; }
    case 'tdel': view.draft.ex.splice(+b.dataset.i,1); render(); sfx('remove'); break;
    case 'tsave': {
      const d=view.draft, name=(d.name||'').trim();
      if(!name){ sfx('error'); toast('Дай тренировке название'); $('#tplname').focus(); return; }
      if(!d.ex.length){ sfx('error'); toast('Добавь хотя бы одно упражнение'); return; }
      const t={id:d.id,name:name,ex:d.ex.slice()}; const i=S.templates.findIndex(x=>x.id===d.id);
      if(i>=0) S.templates[i]=t; else S.templates.push(t);
      d.ex.forEach(addMy); save(); persistOnce(); view.orig=JSON.stringify({n:name,e:d.ex}); d.name=name;
      sfx('check'); toast('Сохранено'); back(); break; }
    case 'tremove': { const d=view.draft; if(!(await ask('Удалить тренировку «'+(d.name||'без названия')+'»? История останется.','Удалить',true))) return; S.templates=S.templates.filter(t=>t.id!==d.id); save(); sfx('remove'); view.orig=JSON.stringify({n:d.name.trim(),e:d.ex}); back(); break; }
    case 'opensd': openSub({name:'sd',id:id}); break;
    case 'editset': {
      const ss=S.sessions.find(x=>x.id===view.id); if(!ss) return;
      const ii=+b.dataset.ii, si=+b.dataset.si, it=ss.items[ii], s=it&&it.sets[si]; if(!s) return;
      const e=exById(it.exId), L=LABELS[e.kind]||LABELS.wr; editCtx={sid:ss.id,ii:ii,si:si};
      openSheet('<div class="sheet-h"><div class="sh-row"><h2>Исправить подход</h2><button class="btn btn-icon btn-xs" data-act="sheetclose" aria-label="Закрыть">✕</button></div></div>'
        +'<p class="small muted" style="font-weight:600;margin:0 0 14px">'+esc(e.name)+' · подход '+(si+1)+' · '+esc(fmtD(ss.start))+'</p>'
        +'<div class="editgrid"><div><label class="lbl" for="esw">'+L[0]+'</label><input class="inp" id="esw" inputmode="decimal" autocomplete="off" value="'+(num(s.w)>0?fmtN(s.w):'')+'" placeholder="—"></div>'
        +'<div><label class="lbl" for="esr">'+L[1]+'</label><input class="inp" id="esr" inputmode="decimal" autocomplete="off" value="'+fmtN(s.r)+'"></div></div>'
        +'<button class="btn btn-wide btn-big btn-green" data-act="essave">Сохранить</button>'
        +'<button class="link danger" data-act="esdel">Удалить этот подход</button>', ()=>render());
      break; }
    case 'essave': {
      const c=editCtx, ss=c&&S.sessions.find(x=>x.id===c.sid), it=ss&&ss.items[c.ii], s=it&&it.sets[c.si]; if(!s){ closeSheet(); return; }
      const w=num(($('#esw')||{}).value), r=num(($('#esr')||{}).value);
      if(r<=0){ sfx('error'); toast('Второе поле должно быть больше нуля'); return; }
      s.w=w>0?w:0; s.r=r; save(); sfx('check'); toast('Исправлено'); closeSheet(); break; }
    case 'esdel': {
      const c=editCtx, ss=c&&S.sessions.find(x=>x.id===c.sid), it=ss&&ss.items[c.ii]; if(!it||!it.sets[c.si]){ closeSheet(); return; }
      const lastOne=ss.items.length===1&&it.sets.length===1;
      if(!(await ask(lastOne?'Это последний подход в тренировке. Удалить всю запись?':'Удалить этот подход из истории?','Удалить',true))) return;
      if(lastOne){ S.sessions=S.sessions.filter(x=>x!==ss); save(); sfx('remove'); closeSheet(()=>back()); toast('Запись удалена'); break; }
      it.sets.splice(c.si,1); if(!it.sets.length) ss.items.splice(c.ii,1);
      save(); sfx('remove'); toast('Подход удалён'); closeSheet(); break; }
    case 'hmode': histMode=b.dataset.v; render(); break;
    case 'cmetric': S.settings.chart=Object.assign({},S.settings.chart,{m:b.dataset.v}); save(); render(); break;
    case 'cper': S.settings.chart=Object.assign({},S.settings.chart,{p:b.dataset.v}); save(); render(); break;
    case 'chopen': S.settings.chart=Object.assign({},S.settings.chart,{ex:id}); save(); histMode='chart'; switchTab('hist'); break;
    case 'sddel': if(await ask('Удалить запись этой тренировки навсегда?','Удалить',true)){ S.sessions=S.sessions.filter(s=>s.id!==id); save(); sfx('remove'); back(); } break;
    case 'exdel': {
      if(S.sessions.some(s=>s.items.some(i=>i.exId===id))||(S.active&&S.active.items.some(i=>i.exId===id))){ toast('По нему есть история — удалить нельзя, только убрать из моих'); return; }
      if(!(await ask('Удалить упражнение? Оно пропадёт и из шаблонов.','Удалить',true))) return;
      S.custom=S.custom.filter(e=>e.id!==id); S.my=S.my.filter(x=>x!==id); S.templates.forEach(t=>{ t.ex=t.ex.filter(x=>x!==id); }); save(); sfx('remove'); back(); break; }
    case 'clipplay': { const c=clips.find(x=>x.id===id); if(c) playClip(c); break; }
    case 'clipdel': { const c=clips.find(x=>x.id===id); if(!c||!(await ask('Удалить клип «'+c.name+'»?','Удалить',true))) return; idbDel(id).catch(()=>{}); clips=clips.filter(x=>x.id!==id); delete bufCache[id]; render(); sfx('remove'); break; }
    case 'rest': S.settings.rest=+b.dataset.v; save(); render(); break;
    case 'sfxtry': sfx(b.dataset.k,true); break;
    case 'theme': S.settings.theme=b.dataset.v; save(); render(); sfx('check'); break;
    case 'rminus': if(restEnd){ restEnd-=15000; tick(); } break;
    case 'rplus': if(restEnd){ restEnd+=15000; restTotal+=15000; tick(); } break;
    case 'rskip': stopRest(); break;
    case 'export': exportData(); break;
    case 'pastebk': openSheet('<div class="sheet-h"><div class="sh-row"><h2>Вставить бэкап</h2><button class="btn btn-icon btn-xs" data-act="sheetclose" aria-label="Закрыть">✕</button></div></div><p class="small" style="font-weight:600;margin:0 0 12px">Вставь текст бэкапа целиком — он начинается с {"app":"zhelezo".</p><textarea class="inp" id="bktext" placeholder="{&quot;app&quot;:&quot;zhelezo&quot;…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button class="btn btn-wide btn-big btn-green" data-act="pastego">Загрузить</button>'); break;
    case 'pastego': { const ok=await importText(($('#bktext')||{}).value); if(ok) closeSheet(); break; }
    case 'tghome': try{ TG.addToHomeScreen(); }catch(err){ toast('Эта версия Telegram так не умеет'); } break;
    case 'wipe':
      if(!(await ask('Стереть ВСЕ тренировки, шаблоны и клипы'+(CS.ok?' — и на телефоне, и в облаке Telegram':' с этого телефона')+'?','Стереть',true))) return;
      if(!(await ask('Точно? Это не отменить. Бэкап сохранил?','Стереть всё',true))) return;
      try{ localStorage.removeItem(KEY); }catch(err){}
      idbClear().catch(()=>{}); clips=[]; S=DEF(); save(); stopRest(); wakeOff(); sfx('remove'); toast('Всё стёрто'); render(); break;
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f&&S.active){
    const r=t.closest('.set'); if(!r) return;
    const s=S.active.items[+r.dataset.ii]&&S.active.items[+r.dataset.ii].sets[+r.dataset.si]; if(!s) return;
    s[t.dataset.f]=t.value.replace(/[^\d.,]/g,''); if(t.value!==s[t.dataset.f]) t.value=s[t.dataset.f];
    saveSoon(); return;
  }
  if(t.id==='exq'){ exQ=t.value; $('#exlist').innerHTML=exListHTML(); document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!exQ.trim()&&c.dataset.g===exG)); return; }
  if(t.id==='pq'&&pick){ pick.q=t.value; $('#plist').innerHTML=pickListHTML(); return; }
  if(t.id==='tplname'&&view.draft){ view.draft.name=t.value; return; }
  if(t.dataset&&t.dataset.ch==='chance'){ S.settings.setChance=+t.value; const v=$('#chv'); if(v) v.textContent=t.value+'%'; saveSoon(); return; }
  if(t.dataset&&t.dataset.ch==='sfxvol'){ S.settings.sfxVol=+t.value; const v=$('#svv'); if(v) v.textContent=t.value+'%'; saveSoon(); return; }
});

document.addEventListener('keydown',e=>{
  const t=e.target; if(e.key!=='Enter'||!t.dataset||!t.dataset.f) return;
  e.preventDefault();
  const r=t.closest('.set'); if(!r) return;
  if(t.dataset.f==='w'){ const n=r.querySelector('input[data-f="r"]'); if(n) n.focus(); }
  else { t.blur(); checkSet(+r.dataset.ii,+r.dataset.si); }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ch==='sound'){ S.settings.sound=t.checked; save(); toast(t.checked?'Озвучка включена':'Озвучка выключена'); return; }
  if(t.dataset&&t.dataset.ch==='chance'){ S.settings.setChance=+t.value; save(); return; }
  if(t.dataset&&t.dataset.ch==='sfxvol'){ S.settings.sfxVol=+t.value; save(); sfx('check',true); return; }
  if(t.dataset&&t.dataset.ch==='sfx'){ S.settings.sfx=t.checked; save(); if(t.checked) sfx('check'); return; }
  if(t.dataset&&t.dataset.ch==='ui'){ S.settings.ui=t.checked; save(); if(t.checked) sfx('tick'); return; }
  if(t.dataset&&t.dataset.ch==='awake'){ S.settings.awake=t.checked; save(); if(t.checked) wakeOn(); else wakeOff(); const el=$('#wlstat'); if(el) el.textContent=wlText(); return; }
  if(t.id==='chex'){ S.settings.chart=Object.assign({},S.settings.chart,{ex:t.value}); save(); render(); return; }
  if(t.dataset&&t.dataset.ch==='import'){ if(t.files&&t.files[0]) importData(t.files[0]); t.value=''; return; }
  if(t.dataset&&t.dataset.slot){
    const files=Array.from(t.files||[]); const slot=t.dataset.slot; t.value='';
    (async()=>{
      let added=0;
      for(const f of files){
        if(f.size>8*1024*1024){ toast('«'+f.name+'» больше 8 МБ — обрежь до одной фразы'); continue; }
        try{
          const data=await f.arrayBuffer();
          const c={id:uid(),slot:slot,name:f.name.replace(/\.[^.]+$/,''),type:f.type,data:data};
          unlockAudio();
          if(actx){ try{ await decode(c); }catch(err){ toast('Телефон не читает «'+f.name+'» — сконвертируй в mp3'); continue; } }
          await idbPut(c); clips.push(c); added++;
        }catch(err){ toast('Не удалось сохранить «'+f.name+'»'); }
      }
      if(added){ toast('Добавлено клипов: '+added); persistOnce(); }
      render();
    })();
  }
});

/* старт */
if(S.active) view={name:'session'};
render();
setTimeout(()=>{ checkStale(); wakeOn(); },1500);
if(looksLikeTG()) loadTG().then(initTG);
if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
window.__zh={get S(){return S;},DB:DB,search:search,get CS(){return CS;},
  renderSfx(name){ const saved=actx, sb=SFX.bus, sn=SFX.noise; const off=new OfflineAudioContext(1,44100*3,44100); actx=off; SFX.bus=null; SFX.noise=null; try{ SOUNDS[name](0.01); } finally { actx=saved; SFX.bus=sb; SFX.noise=sn; } return off.startRendering().then(b=>Array.from(b.getChannelData(0))); }};
})();
</script>
</body>
